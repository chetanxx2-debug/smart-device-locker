<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Device Locker - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b1120; color: #fff;
      font-family: "Plus Jakarta Sans", sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 24px;
    }
    .icon { font-size: 72px; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #f59e0b; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border: none; color: #fff; padding: 14px 32px;
      border-radius: 12px; font-size: 16px; font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <div class="icon">📵</div>
    <h1>Internet Nahi Hai</h1>
    <p>Smart Device Locker ko kaam karne ke liye internet chahiye.<br>Please internet se connect karein.</p>
    <button onclick="location.reload()">🔄 Dobara Try Karein</button>
  </div>
</body>
</html>
